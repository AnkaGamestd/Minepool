<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mine Pool | Profile</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#16355c,#070b13 60%);color:#fff;font-family:Arial,sans-serif;padding:24px}.wrap{max-width:760px;margin:auto}.back{color:#8edfff;text-decoration:none}.hero,.grid>div{background:#0b1322dd;border:1px solid #ffffff18;border-radius:20px}.hero{margin-top:24px;padding:32px;display:flex;align-items:center;gap:22px}.avatar{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:#0ac4ff22;border:2px solid #25d7ff;font-size:38px}h1{margin:0 0 8px}.rank{color:#8edfff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}.grid>div{padding:24px}.value{font-size:30px;font-weight:800;margin-top:8px}.label{color:#91a2b8;font-size:12px;text-transform:uppercase;letter-spacing:1px}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero{padding:24px}}</style></head><body><main class="wrap"><a class="back" href="index.html">? Back to menu</a><section class="hero"><div class="avatar" id="avatar">P</div><div><h1 id="username">Player</h1><div class="rank" id="rank">Gold League</div></div></section><section class="grid"><div><span class="label">In-game coins</span><div class="value" id="coins">1,000</div></div><div><span class="label">Rating</span><div class="value" id="elo">1,200</div></div><div><span class="label">Games played</span><div class="value" id="games">0</div></div><div><span class="label">Win rate</span><div class="value" id="wins">0%</div></div></section></main><script>async function load(){let user=JSON.parse(localStorage.getItem('user')||'null');try{const r=await fetch('/api/auth/me',{credentials:'include'}),d=await r.json();if(d.success)user=d.user;}catch(e){}if(!user)return location.href='login.html';username.textContent=user.username||'Player';avatar.textContent=(user.username||'P')[0].toUpperCase();coins.textContent=(user.coins||0).toLocaleString();elo.textContent=(user.elo||1200).toLocaleString();games.textContent=user.gamesPlayed||0;wins.textContent=(user.gamesPlayed?Math.round((user.gamesWon||0)/user.gamesPlayed*100):0)+'%';rank.textContent=(user.rank&&user.rank.rank?user.rank.rank:'Gold')+' League';}load();</script></body></html>
