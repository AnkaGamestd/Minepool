<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Mine Pool | Play</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#16355c,#070b13 60%);color:#fff;font-family:Arial,sans-serif}.card{width:min(92vw,430px);padding:38px 30px;border:1px solid #27c7ff55;border-radius:28px;background:#0b1322e8;text-align:center;box-shadow:0 25px 80px #0009}.ball{font-size:72px}h1{letter-spacing:7px;margin:14px 0 6px}p{color:#9db0c7;line-height:1.5}.name{width:100%;padding:14px 16px;margin:20px 0 12px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff0b;color:#fff;font-size:16px}.play{width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(135deg,#00e5ff,#0878ff);color:#03101c;font-weight:900;font-size:18px;cursor:pointer}.play:disabled{opacity:.6}.note{font-size:12px;margin-top:18px}</style></head><body><main class="card"><div class="ball">&#127921;</div><h1>MINE POOL</h1><p>Jump straight into the table. Your progress uses in-game coins only.</p><input id="name" class="name" maxlength="20" value="Player" aria-label="Player name"><button id="play" class="play">PLAY NOW</button><p class="note" id="status">No account setup required.</p></main><script>const button=document.getElementById('play');button.addEventListener('click',async()=>{button.disabled=true;const username=(document.getElementById('name').value||'Player').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,20)||'Player';let user={id:'local-'+Date.now(),username,coins:1000,elo:1200,gamesPlayed:0,gamesWon:0,profileComplete:true};try{const response=await fetch('/api/auth/guest-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({username})});const data=await response.json();if(data.success&&data.user)user=data.user;}catch(e){}localStorage.setItem('user',JSON.stringify(user));localStorage.removeItem('authToken');location.href='/index.html';});</script></body></html>
