<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mine Pool — Profile</title><script src="https://www.youtube.com/game_api/v1"></script><script src="js/youtube-playables.js"></script><link rel="stylesheet" href="menu.css"><style>.profile-shell{min-height:100svh;padding:clamp(20px,4vw,58px);background:linear-gradient(90deg,rgba(3,9,7,.92),rgba(3,9,7,.48)),url('assets/menu-lounge.png') center/cover}.profile-top{display:flex;align-items:center;justify-content:space-between}.back{color:var(--cream);text-decoration:none;font-weight:800;letter-spacing:.08em}.profile-card{width:min(760px,100%);margin:clamp(40px,8vh,90px) auto 0;padding:clamp(26px,5vw,54px);border:1px solid var(--line);border-radius:30px;background:rgba(10,22,18,.88);backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.44)}.identity{display:flex;align-items:center;gap:18px}.identity .avatar{width:76px;height:76px;font-size:30px}.identity h1{margin:0;font-size:clamp(28px,5vw,48px)}.profile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:32px}.profile-stat{padding:18px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--line)}.profile-stat span{display:block}.profile-stat strong{font-size:clamp(22px,4vw,34px);color:var(--gold)}.cloud-note{margin-top:24px;padding:16px;border-left:3px solid var(--gold);color:var(--muted);line-height:1.5}@media(max-width:540px){.profile-grid{grid-template-columns:1fr}.profile-card{margin-top:24px}}</style></head><body><main class="profile-shell"><header class="profile-top"><a class="back" href="index.html">← HOME</a><span class="brand" style="font-size:22px">MINE <span>POOL</span></span></header><section class="profile-card"><div class="identity"><div class="avatar" id="avatar">P</div><div><div class="eyeline">PLAYER PROFILE</div><h1 id="name">Player</h1><div class="platform-note" id="cloud">Loading cloud profile…</div></div></div><div class="profile-grid"><div class="profile-stat"><span class="stat-label">Rating</span><strong id="rating">1,200</strong></div><div class="profile-stat"><span class="stat-label">Coins</span><strong id="coins">1,000</strong></div><div class="profile-stat"><span class="stat-label">Games played</span><strong id="played">0</strong></div><div class="profile-stat"><span class="stat-label">Win rate</span><strong id="rate">0%</strong></div></div><p class="cloud-note">Progress is attached to your YouTube Playables cloud profile. YouTube does not expose your public channel name or avatar to games.</p></section></main><script>(async()=>{const p=window.MinePoolPlatform;const u=await p.init();const f=new Intl.NumberFormat(p.getLocale());document.getElementById('name').textContent=u.username;document.getElementById('avatar').textContent=u.username.slice(0,1).toUpperCase();document.getElementById('rating').textContent=f.format(u.elo);document.getElementById('coins').textContent=f.format(u.coins);document.getElementById('played').textContent=f.format(u.gamesPlayed);document.getElementById('rate').textContent=`${u.gamesPlayed?Math.round(u.gamesWon/u.gamesPlayed*100):0}%`;document.getElementById('cloud').textContent=p.isInPlayables()?'YouTube cloud profile':'Local preview profile';p.markReady()})()</script></body></html>
