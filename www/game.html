<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Mine Pool — Match</title>
  <script src="https://www.youtube.com/game_api/v1"></script>
  <link rel="stylesheet" href="game-shell.css">
</head>
<body>
  <div class="loading-screen" id="loading-screen"><div class="loading-mark">8</div></div>
  <main class="game-shell" aria-label="8-ball pool game">
    <header class="match-hud">
      <section class="player player-panel player-1 active" id="p1-panel">
        <div class="avatar">P</div><div class="player-copy"><span class="player-name" id="p1-name">Player</span><span class="ball-group">SOLIDS</span></div>
        <div class="ball-rack" id="solids-rack"></div>
      </section>
      <div class="turn-core" id="turn-indicator"><span class="turn-label turn-text" id="turn-bar-text">YOUR TURN</span><span class="timer" id="timer-text">30</span></div>
      <section class="player player-panel player-2" id="p2-panel">
        <div class="ball-rack" id="stripes-rack"></div>
        <div class="player-copy"><span class="player-name" id="p2-name">Rival</span><span class="ball-group">STRIPES</span></div><div class="avatar rival">R</div>
      </section>
    </header>

    <section class="table-stage">
      <aside class="spin-console" aria-label="Cue ball spin">
        <span class="control-label">SPIN</span>
        <div class="spin-ball" role="button" tabindex="0" aria-label="Set cue ball spin"><span id="spin-indicator"></span></div>
        <button id="reset-spin" type="button">RESET</button><span id="spin-info">CENTER</span>
      </aside>

      <div class="table-frame">
        <canvas id="pool-table" width="1000" height="500" aria-label="Pool table"></canvas>
      </div>

      <aside class="power-console" aria-label="Shot power">
        <span class="control-label">POWER</span>
        <div id="power-gauge"><div id="power-fill"></div><div id="power-handle"></div></div>
        <output id="power-value">0%</output>
      </aside>
    </section>

    <footer class="game-footer"><span>DRAG TO AIM</span><span>SET POWER • RELEASE TO SHOOT</span><span id="cloud-state">CLOUD PROFILE</span></footer>
  </main>

  <div id="start-screen" class="hidden"></div>
  <div id="game-message" class="game-message hidden"><strong id="message-title"></strong><span id="message-text"></span></div>

  <section id="call-pocket-modal" class="overlay hidden" aria-label="Call a pocket">
    <div class="dialog"><p class="eyebrow">8 BALL</p><h2>CALL YOUR POCKET</h2><div class="pocket-grid">
      <button class="pocket-btn" data-pocket="0" type="button">TOP LEFT</button><button class="pocket-btn" data-pocket="1" type="button">TOP CENTER</button><button class="pocket-btn" data-pocket="2" type="button">TOP RIGHT</button>
      <button class="pocket-btn" data-pocket="3" type="button">BOTTOM LEFT</button><button class="pocket-btn" data-pocket="4" type="button">BOTTOM CENTER</button><button class="pocket-btn" data-pocket="5" type="button">BOTTOM RIGHT</button>
    </div></div>
  </section>

  <section id="winner-screen" class="overlay hidden" aria-live="polite">
    <div class="dialog winner-card"><p class="eyebrow">MATCH COMPLETE</p><h1 id="winner-text">YOU WIN</h1><div class="winner-actions"><button id="play-again" class="primary" type="button">REMATCH</button><button id="btn-back-to-menu" type="button">MAIN MENU</button></div></div>
  </section>

  <script src="physics.js"></script>
  <script src="ai-player.js"></script>
  <script src="game.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const platform = window.MinePoolPlatform;
      const player = await platform.init();
      window.currentUser = player;
      document.getElementById('p1-name').textContent = player.username;
      document.querySelector('#p1-panel .avatar').textContent = player.username.slice(0, 1).toUpperCase();
      document.getElementById('cloud-state').textContent = platform.isInPlayables() ? 'YOUTUBE CLOUD' : 'LOCAL PREVIEW';

      const applyAudio = (enabled) => {
        const sound = window.gameInstance && window.gameInstance.sound;
        if (sound && sound.masterGain) sound.masterGain.gain.value = enabled ? 1 : 0;
      };
      applyAudio(platform.isAudioEnabled());
      document.addEventListener('minepool:audio', (event) => applyAudio(event.detail.enabled));
      document.addEventListener('minepool:pause', () => window.gameInstance && window.gameInstance.pauseForPlatform());
      document.addEventListener('minepool:resume', () => window.gameInstance && window.gameInstance.resumeFromPlatform());

      const mode = new URLSearchParams(location.search).get('mode') === '2player' ? '2player' : 'ai';
      window.gameInstance.startGame(mode);
      document.getElementById('loading-screen').classList.add('is-ready');
      window.setTimeout(() => platform.markReady(), 380);
    });
  </script>
</body>
</html>
